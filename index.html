<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空亦鹤对接服务站 | 印花组</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #ea580c;
  --primary-dark: #c2410c;
  --primary-light: #fff7ed;
  --primary-lighter: #ffedd5;
  --bg: #fafafa;
  --card-bg: #ffffff;
  --border: #f0e6dd;
  --text: #1e293b;
  --text-light: #78716c;
  --radius: 8px;
  --shadow: 0 2px 4px rgba(234,88,12,0.06);
  --sidebar-w: 240px;
  --core-red: #dc2626;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(circle at 1px 1px, rgba(234, 88, 12, 0.03) 1px, transparent 0); background-size: 20px 20px; color: var(--text); line-height: 1.6; min-height: 100vh; }

/* Top bar */
.topbar { display: flex; align-items: center; padding: 0 20px; height: 56px; background: #fff; color: var(--text); position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--primary); box-shadow: 0 2px 12px rgba(234, 88, 12, 0.06); }
.topbar-title { font-size: 20px; font-weight: 800; color: var(--primary); white-space: nowrap; letter-spacing: 1px; padding-left: 12px; border-left: 3px solid var(--primary); }
.topbar-sub { font-size: 13px; color: var(--text-light); margin-left: 12px; border-left: 2px solid var(--primary-lighter); padding-left: 12px; white-space: nowrap; }
.topbar-contact { font-size: 13px; color: var(--text-light); margin-left: 12px; border-left: 2px solid var(--primary-lighter); padding-left: 12px; white-space: nowrap; }

/* Layout */
.layout { display: flex; min-height: calc(100vh - 52px); }

/* Sidebar */
.sidebar { width: var(--sidebar-w); background: #fff; border-right: 1px solid var(--border); padding: 16px 0; flex-shrink: 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; box-shadow: 2px 0 8px rgba(234, 88, 12, 0.04); }
.sidebar-section { margin-bottom: 8px; }
.sidebar-label { font-size: 18px; font-weight: 700; color: #44403c; letter-spacing: 1px; padding: 0 20px; margin-bottom: 10px; }
.sidebar-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; font-size: 15px; color: var(--text); text-decoration: none; transition: all 0.15s; border-left: 3px solid transparent; cursor: pointer; }
.sidebar-item:hover { background: var(--primary-light); }
.sidebar-item.active { background: var(--primary-light); border-left-color: var(--primary); color: var(--primary); font-weight: 600; }
.sidebar-item-icon { font-size: 18px; }
.sidebar-item-text { flex: 1; }
.sidebar-item-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
.badge-done { background: #dcfce7; color: #16a34a; }
.badge-pending { background: #f5f5f4; color: #a8a29e; }
.sidebar-divider { height: 1px; background: var(--border); margin: 8px 20px; }

/* Main */
.main { flex: 1; padding: 20px 24px; overflow-x: hidden; min-width: 0; }
.view { display: none; }
.view.active { display: block; }

/* Search */
.search-bar { margin-bottom: 12px; }
.search-input { width: 100%; max-width: 700px; padding: 10px 14px; font-size: 14px; border: 2px solid var(--border); border-radius: 8px; outline: none; transition: border-color 0.2s; }
.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1); }

/* Tabs (groups) */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tab { padding: 7px 16px; border: none; background: var(--card-bg); border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-light); transition: all 0.2s; border: 1px solid var(--border); }
.tab.active { background: var(--primary); color: white; border-color: var(--primary); }
.tab:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); }

/* Filters */
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.filter-label { font-size: 13px; color: var(--text); margin-right: 4px; font-weight: 600; }
.chip { padding: 4px 12px; border: 1px solid var(--border); border-radius: 16px; font-size: 12px; cursor: pointer; background: var(--card-bg); color: var(--text-light); transition: all 0.15s; }
.chip.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 6px rgba(234, 88, 12, 0.2); }
.chip:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

/* Sub-filter for cat2 */
.sub-filter-bar { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; padding: 8px 0; }
.sub-filter-label { font-size: 12px; color: var(--text-light); margin-right: 4px; font-weight: 600; }
.sub-chip { padding: 3px 10px; border: 1px solid var(--border); border-radius: 14px; font-size: 11px; cursor: pointer; background: var(--bg); color: var(--text-light); transition: all 0.15s; }
.sub-chip.active { background: var(--primary-dark); color: white; border-color: var(--primary-dark); }
.sub-chip:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

.core-toggle { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--text-light); cursor: pointer; }
.core-toggle input { width: 15px; height: 15px; cursor: pointer; }

/* Stats */
.stats-bar { display: flex; gap: 14px; font-size: 12px; color: var(--text-light); margin-bottom: 12px; }
.stat-item { display: flex; align-items: center; gap: 4px; }
.stat-num { font-weight: 700; color: var(--primary); }
.stat-core { color: var(--core-red); }

/* Category list - row based layout */
.cat-group { margin-bottom: 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
.cat-group-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; padding-bottom: 5px; border-bottom: 2px solid var(--primary-lighter); display: flex; align-items: center; gap: 8px; }
.cat-group-icon { font-size: 18px; }
.cat-count { font-size: 13px; color: var(--text-light); font-weight: 400; }

.cat-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.cat-row:hover { background: var(--primary-light); box-shadow: inset 3px 0 0 var(--primary); }
.cat-row:last-child { border-bottom: none; }

.cat-row-name { min-width: 200px; max-width: 260px; flex-shrink: 0; font-size: 15px; font-weight: 600; }
.cat-row-name.core { color: var(--text); }
.cat-row-core-tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1.5px solid var(--core-red); color: var(--core-red); background: transparent; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.cat-row-path { flex: 1; font-size: 14px; color: var(--text-light); line-height: 1.6; word-break: break-all; min-width: 0; }
.cat-row-path-arrow { color: var(--primary); margin: 0 2px; font-weight: 600; }
.cat-row-path-leaf { color: var(--text); font-weight: 500; }
.cat-row-id { font-size: 11px; color: var(--text-light); background: var(--bg); padding: 2px 7px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
.cat-row-actions { flex-shrink: 0; }
.copy-btn { padding: 4px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); cursor: pointer; color: var(--text-light); transition: all 0.15s; white-space: nowrap; }
.copy-btn:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25); }
.copy-btn.copied { background: #16a34a; color: white; border-color: #16a34a; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #16a34a; color: white; padding: 8px 20px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Placeholder */
.placeholder { text-align: center; padding: 80px 20px; color: var(--text-light); }
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.placeholder-desc { font-size: 15px; max-width: 400px; margin: 0 auto 20px; line-height: 1.8; }
.placeholder-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.placeholder-tag { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.tag-orange { background: var(--primary-lighter); color: var(--primary-dark); }
.tag-green { background: #dcfce7; color: #166534; }
.tag-purple { background: #f3e8ff; color: #6b21a8; }

/* Mobile */
.menu-btn { display: none; background: none; border: none; color: var(--primary); font-size: 22px; cursor: pointer; padding: 0 8px; }
.sidebar-overlay { display: none; }

@media (max-width: 1024px) {
  .cat-row-name { min-width: 140px; max-width: 160px; }
}

@media (max-width: 768px) {
  .topbar-sub, .topbar-contact { display: none; }
  .menu-btn { display: block; }
  .sidebar { position: fixed; left: -280px; top: 52px; width: 260px; z-index: 99; transition: left 0.3s; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
  .sidebar.open { left: 0; }
  .sidebar-overlay { display: none; position: fixed; top: 52px; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 98; }
  .sidebar-overlay.show { display: block; }
  .main { padding: 12px 14px; }
  .cat-row { flex-wrap: wrap; }
  .cat-row-name { min-width: 100%; max-width: 100%; }
  .cat-row-path { width: 100%; flex: none; }
  .tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .tab { white-space: nowrap; }
  .filter-bar, .sub-filter-bar { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .core-toggle { margin-left: 0; }
}
</style>
</head>

var currentGroup = "大码男装";
var currentCat1 = "全部";
var currentCat2 = "全部";

function switchView(name, el) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
  var target = document.getElementById('view-' + name);
  if (target) target.classList.add('active');
  var items = document.querySelectorAll('.sidebar-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  if (el) el.classList.add('active');
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
}

function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}

function init() {
  var tabs = document.getElementById("tabs");
  Object.keys(DATA).forEach(function(g) {
    var total = 0;
    var core = 0;
    Object.keys(DATA[g]).forEach(function(c) {
      DATA[g][c].forEach(function(item) { total++; if (item.isCore) core++; });
    });
    var btn = document.createElement("button");
    btn.className = "tab" + (g === currentGroup ? " active" : "");
    btn.textContent = g + " (" + total + ")";
    btn.onclick = function() {
      currentGroup = g; currentCat1 = "全部"; currentCat2 = "全部";
      var allTabs = document.querySelectorAll(".tab");
      for (var i = 0; i < allTabs.length; i++) { allTabs[i].classList.remove("active"); }
      btn.classList.add("active");
      renderChips(); renderSubChips(); render();
    };
    tabs.appendChild(btn);
  });
  renderChips(); renderSubChips(); render();
}

function renderChips() {
  var container = document.getElementById("chipContainer");
  container.innerHTML = "";
  var cats = Object.keys(DATA[currentGroup] || {});
  var allChip = document.createElement("span");
  allChip.className = "chip" + (currentCat1 === "全部" ? " active" : "");
  allChip.textContent = "全部";
  allChip.onclick = function() { currentCat1 = "全部"; currentCat2 = "全部"; renderChips(); renderSubChips(); render(); };
  container.appendChild(allChip);
  cats.forEach(function(c) {
    var chip = document.createElement("span");
    chip.className = "chip" + (currentCat1 === c ? " active" : "");
    chip.textContent = c;
    chip.onclick = function() { currentCat1 = c; currentCat2 = "全部"; renderChips(); renderSubChips(); render(); };
    container.appendChild(chip);
  });
}

function renderSubChips() {
  var bar = document.getElementById("subFilterBar");
  var container = document.getElementById("subChipContainer");
  container.innerHTML = "";
  
  if (currentCat1 === "全部") {
    bar.style.display = "none";
    return;
  }
  
  var groupData = DATA[currentGroup] || {};
  var cat1Data = groupData[currentCat1] || [];
  var cat2Set = [];
  cat1Data.forEach(function(item) {
    var c2 = item.cat2 || "";
    if (cat2Set.indexOf(c2) === -1) cat2Set.push(c2);
  });
  
  if (cat2Set.length <= 1) {
    bar.style.display = "none";
    return;
  }
  
  bar.style.display = "flex";
  var allChip = document.createElement("span");
  allChip.className = "sub-chip" + (currentCat2 === "全部" ? " active" : "");
  allChip.textContent = "全部";
  allChip.onclick = function() { currentCat2 = "全部"; renderSubChips(); render(); };
  container.appendChild(allChip);
  
  cat2Set.forEach(function(c2) {
    var count = 0;
    cat1Data.forEach(function(item) { if ((item.cat2||"") === c2) count++; });
    var chip = document.createElement("span");
    chip.className = "sub-chip" + (currentCat2 === c2 ? " active" : "");
    chip.textContent = c2 + " (" + count + ")";
    chip.onclick = function() { currentCat2 = c2; renderSubChips(); render(); };
    container.appendChild(chip);
  });
}

function onSearch() {
  searchKeyword = document.getElementById("searchInput").value.toLowerCase().trim();
  render();
}

function escapeHtml(text) {
  var div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

  var coreOnly = document.getElementById("coreOnly").checked;

  var cats = currentCat1 === "全部" ? Object.keys(groupData) : [currentCat1];

    groupData[cat].forEach(function(item) {
      totalInGroup++; if (item.isCore) coreInGroup++;
      if (currentCat1 !== "全部" && currentCat2 !== "全部" && (item.cat2||"") !== currentCat2) return;
      if (coreOnly && !item.isCore) return;
      if (searchKeyword) {
        var searchText = (item.leaf + " " + item.path + " " + item.leafId).toLowerCase();
        if (searchText.indexOf(searchKeyword) === -1) return;
      }
      results.push({ cat: cat, item: item });
    });
  });
  
  statsBar.innerHTML = '<div class="stat-item">共 <span class="stat-num">' + totalInGroup + '</span> 条</div><div class="stat-item">核心类目 <span class="stat-num stat-core">' + coreInGroup + '</span> 条</div><div class="stat-item">当前展示 <span class="stat-num">' + results.length + '</span> 条</div>';
  
  if (results.length === 0) { content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);font-size:14px;">未找到匹配的类目，试试其他关键词</div>'; return; }
  
  var byCat = {};
  results.forEach(function(r) { if (!byCat[r.cat]) byCat[r.cat] = []; byCat[r.cat].push(r.item); });
  
  var catIcons = {"T恤/POLO":"👕","外套夹克":"🧥","衬衫/马甲":"👔","背心上衣":"🎽","毛衣/开衫/针织":"🧶","棉服/羽绒服":"🧥","风衣/大衣":"🧥","短裤":"🩳","长裤":"👖","牛仔裤":"👖","套装":"🥋","卫衣/连帽衫":"👕","打底/压缩":"🩲","传统服饰":"👘","功能服":"🦺","防晒衫":"🌞","泳衣泳裤":"🏊","正装":"🤵","家居服/裙/袍":"🛌","连衣裙/半裙":"👗"};
  
  var html = "";
  Object.keys(byCat).forEach(function(cat) {
    var icon = catIcons[cat] || "📦";
    html += '<div class="cat-group"><div class="cat-group-title"><span class="cat-group-icon">' + icon + '</span>' + escapeHtml(cat) + ' <span class="cat-count">(' + byCat[cat].length + '条)</span></div>';
    
    byCat[cat].forEach(function(item) {
      var pathParts = item.path.split(" > ");
      var pathHtml = "";
      for (var i = 0; i < pathParts.length; i++) {
        if (i > 0) pathHtml += ' <span class="cat-row-path-arrow">›</span> ';
        if (i === pathParts.length - 1) {
          pathHtml += '<span class="cat-row-path-leaf">' + escapeHtml(pathParts[i]) + '</span>';
        } else {
          pathHtml += escapeHtml(pathParts[i]);
        }
      }
      
      var nameClass = item.isCore ? "cat-row-name core" : "cat-row-name";
      html += '<div class="cat-row">';
      html += '<span class="' + nameClass + '">' + escapeHtml(item.leaf) + '</span>';
      if (item.isCore) html += '<span class="cat-row-core-tag">核心</span>';
      html += '<span class="cat-row-path">' + pathHtml + '</span>';
      
      html += '<span class="cat-row-actions"><button class="copy-btn" data-copy="' + encodeURIComponent(item.path) + '" onclick="copyFromAttr(this,0)">📋 复制路径</button></span>';
      html += '</div>';
    });
    
    html += '</div>';
  });
  
  content.innerHTML = html;
}

function copyFromAttr(btn, type) {
  var encoded = btn.getAttribute("data-copy");
  var text = decodeURIComponent(encoded);
  var textarea = document.createElement("textarea");
  textarea.value = text;
  document.body.appendChild(textarea);
  textarea.select();
  try { document.execCommand("copy"); } catch(e) { if (navigator.clipboard) navigator.clipboard.writeText(text); }
  document.body.removeChild(textarea);
  btn.classList.add("copied");
  btn.textContent = "✅ 已复制";
  var toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(function() {
    btn.classList.remove("copied");
    btn.textContent = "📋 复制路径";
    toast.classList.remove("show");
  }, 1500);
}

init();
</script>
